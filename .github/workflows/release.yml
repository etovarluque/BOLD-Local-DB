# Publishes a release when a version tag is pushed (git tag v1.3.0 && git push --tags):
# one zip per OS, made by dev/tools/build_release.py. The program's "Update"
# button downloads them from here.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the zips
        run: python dev/tools/build_release.py --version "${GITHUB_REF_NAME#v}" --out dist
      - name: Release notes from CHANGELOG.md
        run: python dev/tools/build_release.py --notes "${GITHUB_REF_NAME#v}" > notes.md
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.zip --title "BOLD-Local-DB $GITHUB_REF_NAME" --notes-file notes.md
