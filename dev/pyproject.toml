# The packages BOLD-Local-DB needs. The launcher at the project root installs
# them with uv into .runtime/, together with its own Python: nothing has to be
# installed by hand. After changing this list, run `uv lock` in this folder.
[project]
name = "bold-local-db"
version = "2.0.0"
requires-python = ">=3.10,<3.14"
dependencies = [
    "PySide6-Essentials>=6.7",   # QtWidgets, QtGui, QtCore: all the Creator uses
    "flask>=3.0",
    "numpy>=1.26",
    "psutil>=5.9",
]

[tool.uv]
# An application, not a package to install
package = false
